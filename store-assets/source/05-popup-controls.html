<!doctype html><html lang="en"><head><meta charset="utf-8"><title>05-popup-controls</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0d1117;color:#f0f6fc;-webkit-font-smoothing:antialiased}h1,p{margin:0} .eyebrow{font-size:13px;letter-spacing:2.4px;font-weight:650;color:#9ba7b7}.accent{height:3px;width:48px;background:linear-gradient(90deg,#47d6c2,#77b8ff,#c89bff,#ff9bcb,#ffc46e);border-radius:4px}.muted{color:#a5b0bf}img{display:block}main{height:100%;padding:85px 78px;background:radial-gradient(ellipse at 81% 47%,#202a40 0%,#131922 32%,transparent 65%)}.brand{display:flex;align-items:center;gap:15px;font-size:17px;color:#c8d2df}.brand img{width:38px;height:38px}.eyebrow{margin-top:104px;margin-bottom:23px;font-size:12px}h1{font-size:62px;line-height:1.08;letter-spacing:-2.6px;font-weight:650}p{font-size:20px;line-height:1.6;margin-top:25px;max-width:480px}.popup{position:absolute;left:812px;top:185px;width:360px;height:430px;border-radius:12px;box-shadow:0 25px 75px #0008;outline:1px solid #8a9bb328}.note{margin-top:36px;color:#7e8c9e;font-size:14px}</style></head><body><main><div class="brand"><img src="../../public/icons/icon-128.png" alt="">Universal GitHub Highlighting</div><div class="eyebrow">JUST THE CONTROLS YOU NEED</div><h1>A little control.<br>A lot of color.</h1><p class="muted">Turn highlighting on or off.<br>Force a file. Fine-tune the color fade.</p><div class="note">Runs locally. Your code stays on your device.</div><img class="popup" src="popup-capture.png" alt="Actual extension popup showing json.hd highlighted"></main></body></html>
