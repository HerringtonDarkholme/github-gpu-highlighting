<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>GitHub highlighting popup, light</title>

</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#eff2f5}
a{color:#0969da}a:hover{color:#0550ae}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
button:focus-visible,input:focus-visible{outline:2px solid #0969da;outline-offset:-2px}
@property --spin{syntax:'<angle>';inherits:false;initial-value:210deg}
@keyframes gh-spin{to{--spin:570deg}}
.spin:hover{animation:gh-spin 1.4s linear infinite}
.btn:hover{background-color:#eff2f5 !important;border-color:#c4ccd5 !important}
.btn:active{background-color:#ebeef1 !important;box-shadow:inset 0 1px 0 rgba(31,35,40,0.05)}
@media (prefers-reduced-motion: reduce){.spin:hover{animation:none}}
</style>
</helmet>
<div style="width: 360px; height: 430px; box-sizing: border-box; background: #ffffff; color: #1f2328; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 14px; line-height: 1.5; display: flex; flex-direction: column; overflow: hidden">

<header style="display: flex; align-items: center; gap: 12px; padding: 16px">
<div style="position: relative; width: 36px; height: 36px; flex-shrink: 0">
<svg width="36" height="36" viewBox="0 0 40 40" aria-hidden="true" style="position: absolute; inset: 0" fill="none" stroke="#d1d9e0" stroke-width="2" stroke-linecap="round"><path d="M14 2v4M20 2v4M26 2v4M14 34v4M20 34v4M26 34v4M2 14h4M2 20h4M2 26h4M34 14h4M34 20h4M34 26h4"></path></svg>
<div class="spin" style="position: absolute; left: 5px; top: 5px; width: 26px; height: 26px; box-sizing: border-box; padding: 2px; border-radius: 7px; background: conic-gradient(from var(--spin), #ff5f6d, #ffc371, #fff275, #5ee7a0, #4fc3f7, #7c83ff, #e27bff, #ff5f6d)">
<div style="width: 100%; height: 100%; border-radius: 5px; background: #1f2328; display: flex; align-items: center; justify-content: center">
<svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"></path></svg>
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
<div style="font-size: 14px; font-weight: 600">GitHub highlighting</div>
<div style="font-size: 12px; color: #59636e">For unsupported languages</div>
</div>
<div style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
<span style="font-size: 12px; color: #59636e">On</span>
<button type="button" class="spin" aria-label="Automatic highlighting" aria-pressed="true" style="position: relative; width: 40px; height: 22px; padding: 1.5px; box-sizing: border-box; border: 0; border-radius: 6px; background: conic-gradient(from var(--spin), #ff5f6d, #ffc371, #fff275, #5ee7a0, #4fc3f7, #7c83ff, #e27bff, #ff5f6d); cursor: pointer">
<span style="position: absolute; inset: -1px; border-radius: 7px; background: #d1d9e0; opacity: 0; transition: opacity 200ms ease"></span>
<span style="position: relative; display: block; width: 100%; height: 100%; box-sizing: border-box; padding: 2px; border-radius: 4.5px; background: #ffffff; transition: background-color 200ms ease">
<span style="display: block; width: 15px; height: 15px; border-radius: 3px; background: #1f2328; transform: translateX(18px); transition: transform 220ms cubic-bezier(0.3, 0.7, 0.4, 1), background-color 200ms ease"></span>
</span>
</button>
</div>
</header>

<main style="display: flex; flex-direction: column; gap: 16px; padding: 0 16px 16px">
<section style="border: 1px solid #d1d9e0; border-radius: 6px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #f6f8fa; border-bottom: 1px solid #d1d9e0">
<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="#59636e" stroke-width="1.3" stroke-linejoin="round" style="flex-shrink: 0"><path d="M3.5 1.5h6l3 3v9.5a.5.5 0 0 1-.5.5h-8.5a.5.5 0 0 1-.5-.5v-12a.5.5 0 0 1 .5-.5z"></path><path d="M9.5 1.5v3h3"></path></svg>
<div style="flex: 1; min-width: 0; font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">main/std/fmt.0</div>
<span style="position: relative; display: inline-block; width: 82px; height: 20px; white-space: nowrap; box-sizing: border-box; border: 1px solid #1a7f37; border-radius: 999px; color: #1a7f37; font-size: 12px; font-weight: 500; line-height: 18px; text-align: center; overflow: hidden; flex-shrink: 0; transition: color 220ms ease, border-color 220ms ease, width 260ms cubic-bezier(0.3, 0.7, 0.4, 1)">
<span aria-hidden="false" style="position: absolute; inset: 0; opacity: 1; transition: opacity 200ms ease">Highlighted</span>
<span aria-hidden="true" style="position: absolute; inset: 0; opacity: 0; transition: opacity 200ms ease">Forced</span>
<span aria-hidden="true" style="position: absolute; inset: 0; opacity: 0; transition: opacity 200ms ease">Off</span>
</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px">
<button type="button" class="btn" style="height: 32px; padding: 0 12px; border: 1px solid #d1d9e0; border-radius: 6px; background: #f6f8fa; color: #25292e; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Force highlight</button>
<div style="font-size: 12px; color: #59636e">Applies to this file until you navigate away.</div>
</div>
</section>

<div style="display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid #d1d9e0; border-radius: 6px">
<div style="display: flex; flex-direction: column; flex: 1; min-width: 0">
<label for="transition-ms-light" style="font-size: 14px; font-weight: 600">Color transition</label>
<div style="font-size: 12px; color: #59636e">Use 0 for instant colors.</div>
</div>
<div style="display: flex; align-items: center; width: 96px; height: 32px; box-sizing: border-box; border: 1px solid #d1d9e0; border-radius: 6px; background: #ffffff; overflow: hidden; flex-shrink: 0">
<input id="transition-ms-light" type="number" min="0" step="50" value="420" style="flex: 1; min-width: 0; height: 30px; padding: 0 4px 0 8px; border: 0; background: transparent; color: #1f2328; font-family: inherit; font-size: 14px; text-align: right">
<span style="padding: 0 10px 0 2px; font-size: 12px; color: #59636e">ms</span>
</div>
</div>
</main>

<footer style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 16px; background: #f6f8fa; border-top: 1px solid #d1d9e0; font-size: 12px; color: #59636e">
<div style="display: flex; align-items: center; gap: 6px">
<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="#1a7f37" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="8" height="8" rx="1.5"></rect><path d="M6.5 1.5v2M9.5 1.5v2M6.5 12.5v2M9.5 12.5v2M1.5 6.5h2M1.5 9.5h2M12.5 6.5h2M12.5 9.5h2"></path></svg>
<span>Runs on WebGPU</span>
</div>
<div style="display: flex; align-items: center; gap: 6px">
<a href="https://gpu-lexer.vercel.app/" target="_blank" rel="noopener" style="display: inline-flex; align-items: center; gap: 4px; text-decoration: none; font-weight: 500">How it works<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5H3.5v9h9V10M9 3h4v4M13 3L7.5 8.5"></path></svg></a>
</div>
</footer>

</div>
</x-dc>



</body></html>
