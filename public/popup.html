<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>GitHub highlighting</title>
<link rel="stylesheet" href="popup.css">
<body>
  <h1>GitHub highlighting</h1>
  <label class="toggle"><input id="enabled" type="checkbox" checked> Enable automatic highlighting</label>
  <p id="availability" role="status">Checking this tab…</p>
  <div id="files"></div>
  <p class="hint">Force applies to this file until you navigate away. Processing stays on your device.</p>
  <script src="popup.js"></script>
</body>
</html>
